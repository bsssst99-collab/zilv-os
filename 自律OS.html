<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>自律 OS</title>
<style>
:root{
  --accRGB:43,168,74;
  --acc:#2BA84A; --onacc:#FFFFFF;
  --alpha:rgba(var(--accRGB),.10);
  --alphaLine:rgba(var(--accRGB),.26);
  --bg:#F5F6F8; --card:#FFFFFF; --card2:#F0F2F5; --line:rgba(17,20,24,.09);
  --tx:#15171A; --dim:#71767D; --dim2:#9AA0A6;
  --sheet:#FFFFFF; --tabbar:rgba(255,255,255,.88); --ph:#FAFBFC;
  --hero1:#FFFFFF; --hero2:#F1F9F2;
  --toastBg:#1D2025; --toastTx:#FFFFFF;
  --track:rgba(17,20,24,.07);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 26px -16px rgba(16,24,40,.18);
  --warn:#C97A12; --warnBg:rgba(224,138,30,.13); --bad:#D9483E;
}
[data-theme="dark"]{
  --accRGB:183,240,106;
  --acc:#B7F06A; --onacc:#0B0C0E;
  --alpha:rgba(var(--accRGB),.12);
  --alphaLine:rgba(var(--accRGB),.28);
  --bg:#0B0C0E; --card:#14161A; --card2:#1B1E24; --line:rgba(255,255,255,.07);
  --tx:#ECEDEF; --dim:#8A9099; --dim2:#5D636B;
  --sheet:#121417; --tabbar:rgba(11,12,14,.82); --ph:#0E1013;
  --hero1:#1C2029; --hero2:#14161A;
  --toastBg:#20242A; --toastTx:#ECEDEF;
  --track:rgba(255,255,255,.08);
  --shadow:none;
  --warn:#FFB259; --warnBg:rgba(255,178,89,.13); --bad:#FF7A6E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}

/* header */
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  padding:calc(18px + env(safe-area-inset-top)) 0 6px}
.hd .date{font-size:12.5px;color:var(--dim);letter-spacing:.06em}
.hd .hello{font-size:22px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.hdright{display:flex;align-items:center;gap:8px}
.lvl{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:100px;padding:6px 11px 6px 8px;font-size:12px;color:var(--dim);white-space:nowrap;
  box-shadow:var(--shadow)}
.lvl b{color:var(--tx);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--acc)}
.themebtn{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);
  color:var(--dim);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
  font-family:inherit;cursor:pointer;box-shadow:var(--shadow)}
.themebtn:active{transform:scale(.94)}

/* hero */
.hero{background:linear-gradient(160deg,var(--hero1) 0%,var(--hero2) 100%);border:1px solid var(--line);
  border-radius:20px;padding:18px;margin:10px 0 14px;display:flex;gap:18px;align-items:center;
  box-shadow:var(--shadow)}
.ring{position:relative;width:96px;height:96px;flex:0 0 96px}
.ring svg{width:96px;height:96px}
.ring .track{stroke:var(--track)}
.ring .fill{stroke:var(--acc);transition:stroke-dashoffset .5s ease}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-size:19px;font-weight:650;letter-spacing:-.02em}
.ring .pct span{font-size:10.5px;color:var(--dim);letter-spacing:.08em}
.hinfo{flex:1;min-width:0}
.hinfo .t{font-size:13px;color:var(--dim)}
.hinfo .s{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:2px 0 4px}
.hinfo .s em{font-style:normal;font-size:13px;color:var(--dim);font-weight:500;margin-left:5px}
.xpbar{height:3px;background:var(--track);border-radius:3px;overflow:hidden;margin-top:10px}
.xpbar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .4s}
.hinfo .sm{font-size:11.5px;color:var(--dim);margin-top:6px}

/* section title */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 10px}
.sec h2{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.05em;margin:0}
.sec span{font-size:12px;color:var(--dim)}

/* task card */
.task{display:flex;gap:13px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:13px 14px;margin-bottom:10px;transition:.18s;box-shadow:var(--shadow);cursor:pointer}
.task:active{transform:scale(.988)}
.task .ico{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-size:19px}
.task .mid{flex:1;min-width:0}
.task .nm{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.task .sub{font-size:11.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .act{flex:0 0 auto}
.task.done{border-color:var(--alphaLine);background:var(--alpha)}
.task .thumb{width:40px;height:40px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.btn{appearance:none;border:0;border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;
  background:var(--acc);color:var(--onacc);font-family:inherit;cursor:pointer}
.btn:active{opacity:.82}
.btn:disabled{opacity:.55;background:var(--card2);color:var(--dim)}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--bad)}
.btn.wide{width:100%;padding:13px;border-radius:13px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:100px;
  background:var(--alpha);color:var(--acc)}
.chip.late{background:var(--warnBg);color:var(--warn)}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;color:var(--dim)}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.stat .v em{font-style:normal;font-size:12px;color:var(--dim);font-weight:500;margin-left:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
  margin-bottom:10px;box-shadow:var(--shadow)}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.calnav .m{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--tx);flex:1;text-align:center}
.calnav .m small{display:block;font-size:10px;color:var(--dim);font-weight:500;letter-spacing:.14em;margin-top:2px;text-transform:uppercase}
.calnav button{width:32px;height:32px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--tx);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.calnav button:disabled{opacity:.35}
.calwk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:10.5px;color:var(--dim);text-align:center;margin-bottom:5px;font-weight:600;letter-spacing:.05em}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;padding:7px;border-radius:16px}
.calcell{width:100%;aspect-ratio:1/1.16;border-radius:14px;display:flex;flex-direction:column;align-items:center;
  padding-top:5px;cursor:pointer;position:relative;background:transparent}
.calcell .dn{font-size:11px;color:var(--dim);line-height:1;font-weight:500}
.calcell .de{flex:1;width:100%;display:flex;align-items:center;justify-content:center}
.calcell .de img{width:40px;height:40px;display:block}
.calcell .de img.dim{opacity:.4}
.calcell .de .empty{width:8px;height:8px;border-radius:50%;background:rgba(17,20,24,.1);display:block}
.calcell.today .dn{color:var(--acc);font-weight:700}
.calcell.today::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--acc)}
.calcell.future{opacity:.4;cursor:default}
.calcell.future .de .empty{background:rgba(17,20,24,.05)}
[data-theme="dark"] .calcell .de .empty{background:rgba(255,255,255,.1)}
[data-theme="dark"] .calcell.future .de .empty{background:rgba(255,255,255,.05)}
.calcell.blank{visibility:hidden}
.emo{display:inline-block;object-fit:contain;vertical-align:-2px}
.moodrow{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:4px}
.mbtn{background:var(--card2);border:1.5px solid transparent;border-radius:14px;padding:8px 2px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit}
.mbtn img{width:36px;height:36px}
.mbtn span{font-size:10.5px;color:var(--dim)}
.mbtn.sel{border-color:var(--acc);background:var(--alpha)}
.mbtn.sel span{color:var(--acc);font-weight:600}
.bars{margin-top:6px}
.barrow{display:flex;align-items:center;gap:10px;margin:9px 0}
.barrow .n{font-size:12.5px;width:78px;color:var(--dim);flex:0 0 78px}
.barrow .b{flex:1;height:6px;border-radius:6px;background:var(--track);overflow:hidden}
.barrow .b i{display:block;height:100%;background:var(--acc);border-radius:6px}
.barrow .p{font-size:12px;width:36px;text-align:right;color:var(--tx)}

/* settings */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lb{font-size:14px}
.row .ds{font-size:11.5px;color:var(--dim);margin-top:2px}
.row input[type=time],.row input[type=number]{background:var(--card2);border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:8px 10px;font-size:14px;font-family:inherit;width:112px;text-align:center}
.row input[type=time]{width:128px}
.panel-h{font-size:12.5px;color:var(--dim);margin:0 0 10px;font-weight:400}
.switch{width:46px;height:27px;border-radius:100px;background:var(--track);position:relative;flex:0 0 46px;transition:.2s}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--acc)}
.switch.on i{left:22px}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--dim);font-family:inherit;font-size:13px;
  padding:8px 0;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:var(--tabbar);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar button{flex:1;background:none;border:0;color:var(--dim);font-family:inherit;font-size:12.5px;
  padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabbar button span{font-size:18px;line-height:1}
.tabbar button.on{color:var(--tx)}
.tabbar button.on span{color:var(--acc)}

/* modal */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;
  background:rgba(0,0,0,.35);backdrop-filter:blur(3px)}
[data-theme="dark"] .modal{background:rgba(0,0,0,.62)}
.modal.show{display:flex}
.sheet{width:100%;max-height:92vh;overflow:hidden;overscroll-behavior:none;background:var(--sheet);border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  animation:up .22s ease-out;max-width:520px;margin:0 auto}
@keyframes up{from{transform:translateY(22px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--track);margin:6px auto 14px}
.sheet h3{font-size:17px;margin:0 0 3px;letter-spacing:-.01em}
.sheet p.d{font-size:12.5px;color:var(--dim);margin:0 0 16px}
.ph{border:1px dashed var(--line);border-radius:16px;aspect-ratio:4/5;max-height:38vh;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);
  font-size:12.5px;background:var(--ph);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.opt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.opt button{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:100px;
  padding:8px 13px;font-size:13px;font-family:inherit;cursor:pointer}
.opt button.sel{background:var(--alpha);border-color:var(--alphaLine);color:var(--acc)}
textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:13px;
  padding:12px;font-family:inherit;font-size:14px;resize:none;line-height:1.6}
textarea::placeholder{color:var(--dim2)}
.gps{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px;font-size:12.5px;
  color:var(--dim);line-height:1.7}
.gps b{color:var(--tx);font-size:20px;font-weight:650;display:block;margin-bottom:2px}

/* alarm overlay（固定深色） */
.alarm{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:radial-gradient(circle at 50% 30%,#1C2A17,#07080A 70%);
  padding:32px;text-align:center;color:#ECEDEF}
.alarm.show{display:flex}
.alarm .clock{font-size:56px;font-weight:200;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.alarm .lab{font-size:13px;color:#8A9099;letter-spacing:.18em;text-transform:uppercase;margin-top:6px}
.alarm .msg{font-size:15px;color:#C9D3BE;margin:26px 0 0;font-weight:500}
.alarm .btns{width:100%;max-width:320px;margin-top:34px;display:flex;flex-direction:column;gap:10px}
.alarm .btn{background:#B7F06A;color:#0B0C0E}
.alarm .btn.line{background:transparent;border:1px solid rgba(255,255,255,.16);color:#ECEDEF}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:70;
  background:var(--toastBg);color:var(--toastTx);border-radius:11px;padding:10px 16px;font-size:13px;
  opacity:0;transition:.22s;pointer-events:none;max-width:80%;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.help{font-size:11.5px;color:var(--dim2);line-height:1.7;margin:26px 0 10px}
.drow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.drow:last-of-type{border-bottom:0}
.drow .di{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:16px}
.drow .dm{flex:1;min-width:0}
.drow .dt{font-size:13.5px;font-weight:600}
.drow .dv{font-size:11.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nudge{display:flex;gap:11px;align-items:center;background:var(--warnBg);
  border:1px solid rgba(224,138,30,.22);border-radius:16px;padding:13px 14px;margin-bottom:10px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <div>
      <div class="date" id="hdDate"></div>
      <div class="hello" id="hdHello"></div>
    </div>
    <div class="hdright">
      <div class="lvl"><i class="dot"></i>Lv <b id="hdLv">1</b></div>
      <button class="themebtn" id="themeBtn">☾</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabbar">
  <button data-tab="today" class="on"><span>◎</span>今日</button>
  <button data-tab="stats"><span>▤</span>记录</button>
  <button data-tab="set"><span>☰</span>设置</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="alarm" id="alarm">
  <div class="clock" id="alClock">07:00</div>
  <div class="lab">Wake Up</div>
  <div class="msg" id="alMsg">该起床了。拍一张洗漱完的照片，今天才算开始。</div>
  <div class="btns">
    <button class="btn wide" id="alGo">拍照打卡，立刻起床</button>
    <button class="btn line wide" id="alSnooze">再给我 5 分钟</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<input id="fileInput" type="file" accept="image/*" capture="environment" style="display:none">
<input id="jsonInput" type="file" accept="application/json,.json" style="display:none">

<script>
"use strict";
/* ===== 存储 ===== */
const LS = "selfdrive.v1";
const APP_VERSION = "1.3.1";
/* 更新信息 JSON 地址：GitHub 仓库 version.json 的原始地址。留空时「检查更新」会提示未配置。 */
const UPDATE_JSON_URL = "https://raw.githubusercontent.com/bsssst99-collab/zilv-os/master/version.json";
const TASKS = [
  {id:"wake", nm:"晨间洗漱打卡", ico:"☀️"},
  {id:"out",  nm:"出门打卡",     ico:"🚪"},
  {id:"gym",  nm:"运动打卡",     ico:"🏃"},
  {id:"mood", nm:"心情日记",     ico:"🫧"},
];

function allDone(d){ return !!(d && d.wake && d.out && d.gym && d.mood); }
const PHOTO_KEEP_DAYS = 24;

function defState(){
  return {
    tab:"today",
    settings:{
      wake:"07:00", sleep:"23:00", outBy:"23:00",
      grace:30, radius:300, anchor:null, notify:false, theme:"light"
    },
    days:{},
    flags:{}
  };
}
let S = null;
function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(!raw) return defState();
    const o = JSON.parse(raw);
    return Object.assign(defState(), o, {settings:Object.assign(defState().settings, o.settings||{})});
  }catch(e){ return defState(); }
}
function save(){
  prune();
  try{ localStorage.setItem(LS, JSON.stringify(S)); }
  catch(e){ stripPhotos(); try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(_){ toast("存储空间不足"); } }
}
function stripPhotos(){
  Object.keys(S.days).forEach(k=>{
    const d=S.days[k]; ["wake","out","gym"].forEach(t=>{ if(d[t]) d[t].photo=null; });
  });
}
function prune(){
  const keys = Object.keys(S.days).sort().reverse();
  keys.slice(PHOTO_KEEP_DAYS).forEach(k=>{
    const d=S.days[k]; ["wake","out","gym"].forEach(t=>{ if(d[t]) d[t].photo=null; });
  });
}

/* ===== 日期工具 ===== */
const pad = n=>String(n).padStart(2,"0");
function key(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function addDays(d,n){ const x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function today(){ return key(new Date()); }
function day(k){ if(!S.days[k]) S.days[k]={}; return S.days[k]; }
function fmtT(ts){ const d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function atTime(hm){ const p=(hm||"07:00").split(":"); const d=new Date(); d.setHours(+p[0],+p[1],0,0); return d; }
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];

/* ===== 计算 ===== */
function pts(d){
  if(!d) return 0;
  let p=0;
  if(d.wake) p += d.wake.late ? 15 : 30;
  if(d.out) p += 40;
  if(d.gym) p += 30;
  if(d.mood) p += 15;
  return p;
}
function totalXP(){ return Object.keys(S.days).reduce((a,k)=>a+pts(S.days[k]),0); }
function level(){ const xp=totalXP(); return {lv:Math.floor(xp/300)+1, cur:xp%300, need:300, xp}; }
function doneCount(d){ if(!d) return 0; return ["wake","out","gym","mood"].filter(t=>d[t]).length; }
function qualified(d){ return !!(d && d.wake && d.out); }
function streak(){
  let d = new Date();
  if(!qualified(S.days[key(d)])) d = addDays(d,-1);
  let n=0;
  while(qualified(S.days[key(d)])){ n++; d=addDays(d,-1); if(n>4000) break; }
  return n;
}
function rate(days0){
  const arr=[]; for(let i=0;i<days0;i++) arr.push(addDays(new Date(),-i));
  const q=arr.filter(d=>qualified(S.days[key(d)])).length;
  return Math.round(q/days0*100);
}

/* ===== 主题 ===== */
function applyTheme(){
  const t = S.settings.theme || "light";
  const sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const dark = t==="dark" || (t==="auto" && sysDark);
  document.documentElement.setAttribute("data-theme", dark?"dark":"light");
  const btn = document.getElementById("themeBtn");
  if(btn) btn.textContent = dark ? "☀" : "☾";
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", dark?"#0B0C0E":"#F5F6F8");
  try{ if(window.NativeUI && window.NativeUI.setDark) window.NativeUI.setDark(dark); }catch(e){}
}
if(window.matchMedia){
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const h = ()=>{ if((S && S.settings.theme)==="auto") applyTheme(); };
  if(mq.addEventListener) mq.addEventListener("change", h);
  else if(mq.addListener) mq.addListener(h);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  S.settings.theme = cur==="dark" ? "light" : "dark";
  save(); applyTheme();
}

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._h); toast._h=setTimeout(()=>t.classList.remove("show"),2200);
}
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function beep(times){
  try{
    const AC = window.AudioContext||window.webkitAudioContext;
    const ctx = new AC(); let i=0;
    const burn = ()=>{
      if(i>=times){ ctx.close(); return; }
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=880;
      g.gain.setValueAtTime(0,ctx.currentTime);
      g.gain.linearRampToValueAtTime(.5,ctx.currentTime+.05);
      g.gain.linearRampToValueAtTime(0,ctx.currentTime+.32);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime+.34);
      i++; setTimeout(burn,700);
    };
    burn();
  }catch(e){}
}

/* ===== 拍照 ===== */
const fileInput = document.getElementById("fileInput");
let photoCb = null;
fileInput.addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  fileInput.value = "";
  if(!f) return;
  compress(f, 620, 0.58).then(d=>{ if(photoCb) photoCb(d); }).catch(()=>toast("图片读取失败"));
});
function shoot(cb){ photoCb = cb; fileInput.click(); }
function compress(file, max, q){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      const sc = Math.min(1, max/Math.max(w,h));
      const c = document.createElement("canvas");
      c.width = Math.round(w*sc); c.height = Math.round(h*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}

/* ===== 弹层 ===== */
const modal = document.getElementById("modal");
const sheet = document.getElementById("sheet");
let _prevBodyOverflow = "", _prevBodyOB = "";
function openSheet(html){
  sheet.innerHTML = '<div class="grab"></div>' + html;
  _prevBodyOverflow = document.body.style.overflow;
  _prevBodyOB = document.body.style.overscrollBehavior;
  document.body.style.overflow = "hidden";
  document.body.style.overscrollBehavior = "none";
  modal.classList.add("show");
}
function closeSheet(){
  modal.classList.remove("show");
  sheet.innerHTML="";
  document.body.style.overflow = _prevBodyOverflow;
  document.body.style.overscrollBehavior = _prevBodyOB;
}
modal.addEventListener("click", e=>{ if(e.target === modal) closeSheet(); });
/* 子页面打开时禁止上下滑动/弹性效果，仅点空白收起；表单控件内的触摸不受影响 */
modal.addEventListener("touchmove", e=>{
  const t = e.target;
  if(t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.tagName === "SELECT")) return;
  e.preventDefault();
}, {passive:false});
window.closeSheet = closeSheet;

          stroke-dasharray="${dash}" stroke-dashoffset="${dash*(1-pct/100)}"/>

      <div class="s">${st}<em>天</em></div>
      <div class="xpbar"><i style="width:${(L.cur/L.need*100).toFixed(0)}%"></i></div>
      <div class="sm">Lv ${L.lv} · ${L.xp} XP · 距下一级 ${L.need-L.cur}</div>
    </div>
  </div>`;

  const nap = sleepNudge();
  if(nap) html += `<div class="nudge"><div style="font-size:18px">${nap.icon}</div><div>${nap.text}</div></div>`;

  html += `<div class="sec"><h2>今日任务</h2><span>${n} / 4 完成</span></div>`;
  html += taskCard("wake", d.wake, buildWakeSub(d));
  html += taskCard("out",  d.out,  buildOutSub(d));
  html += taskCard("gym",  d.gym,  buildGymSub(d));
  html += taskCard("mood", d.mood, buildMoodSub(d));

  if(pct===100){
    html += `<div class="panel" style="border-color:var(--alphaLine);background:var(--alpha);display:flex;gap:12px;align-items:center">
      <div style="font-size:22px">🌱</div>
      <div><div style="font-size:14px;font-weight:600">今天全部完成</div>
      <div style="font-size:11.5px;color:var(--dim);margin-top:2px">连续 ${st} 天 · 别在今天晚上把它弄丢</div></div>
    </div>`;
  }

  html += `<div class="panel" style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px">
    <div>
      <div style="font-size:12.5px;color:var(--dim)">今日作息</div>
      <div style="font-size:19px;font-weight:650;letter-spacing:-.02em;margin-top:3px">${S.settings.wake} — ${S.settings.sleep}</div>
    </div>
    <div style="text-align:right;font-size:11.5px;color:var(--dim);line-height:1.6">
      ${sleepLeft()}<br>宽限 ${S.settings.grace} 分钟
    </div>
  </div>`;

  html += `<div class="help">
  · 闹钟需要本页面保持打开（建议「添加到主屏幕」后台常驻）<br>
  · 出门打卡需距离基准点 ≥ ${S.settings.radius} 米，或提交户外实拍照<br>
  · 数据保存在本机浏览器，可在「设置」里导出备份
  </div>`;

  document.getElementById("main").innerHTML = html;
  bindTasks();
}

function sleepLeft(){
  const sl = atTime(S.settings.sleep);
  const diff = sl - new Date();
  if(diff <= 0) return "已过就寝时间";
  const h = Math.floor(diff/3600000), m = Math.floor(diff%3600000/60000);
  return h>0 ? `距就寝 ${h} 小时 ${m} 分` : `距就寝 ${m} 分钟`;
}
function sleepNudge(){
  const d = S.days[today()] || {};
  const sl = atTime(S.settings.sleep);
  const now = new Date();
  if(now >= sl && !d.mood) return {icon:"🫧", text:"已经到就寝时间，今天的心情还没记。一句话就够。"};
  if(now >= new Date(sl.getTime()-30*60000) && !d.mood)
    return {icon:"🌙", text:`还有 ${Math.max(1,Math.round((sl-now)/60000))} 分钟就寝，先把今天的日记补上。`};
  return null;
}

function taskCard(id, rec, sub){
  const t = TASKS.find(x=>x.id===id);
  const hasPhoto = rec && rec.photo;
  let act = "";
  if(hasPhoto){
    act = `<img class="thumb" src="${rec.photo}" data-photo="${id}">`;
  }else if(rec){
    act = `<span class="chip${rec.late?" late":""}">${rec.late?"迟到":"完成"} ${fmtT(rec.t)}</span>`;
  }else{
    act = `<button class="btn" data-do="${id}">打卡</button>`;
  }
  return `<div class="task ${rec?"done":""}" data-do="${id}">
    <div class="ico">${t.ico}</div>
    <div class="mid"><div class="nm">${t.nm}</div><div class="sub">${sub}</div></div>
    <div class="act">${act}</div>
  </div>`;
}
function buildWakeSub(d){
  if(d.wake) return `已记录 ${fmtT(d.wake.t)}${d.wake.late?" · 超出宽限":""}`;
  return `拍洗漱完的照片 · 闹钟 ${S.settings.wake}`;
}
function buildOutSub(d){

    if(d.out.method==="gps") return `已出门 · 距基准点 ${Math.round(d.out.dist)} 米`;

  }
  return `定位或户外照 · 建议 ${S.settings.outBy} 前`;
}
function buildGymSub(d){
  if(d.gym) return `${d.gym.type} · ${d.gym.dur} 分钟`;
  return "记录训练类型与时长";
}
function buildMoodSub(d){
  if(d.mood) return `${moodImg(d.mood.score,17)} ${esc((d.mood.text||"").slice(0,18)) || "已记录"}`;
  return "一句话记录今天的状态";
}

function bindTasks(){
  document.querySelectorAll("#main .task").forEach(el=>{
    el.addEventListener("click", ev=>{
      if(ev.target.closest("[data-photo]")) return;
      const id = el.getAttribute("data-do");

/* ===== 出门打卡 ===== */
function dist(c){
  const a = S.settings.anchor; if(!a) return 0;
  const R=6371000, r=Math.PI/180;
  const dLat=(c.lat-a.lat)*r, dLng=(c.lng-a.lng)*r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(c.lat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function openOut(){
  const anchor = S.settings.anchor;
  openSheet(`<h3>出门打卡</h3>
    <p class="d">获取定位，证明你已离开基准点 ${S.settings.radius} 米以外；定位不可用时用户外实拍兜底。</p>
    <div class="gps" id="gpsBox">尚未获取定位</div>
    <button class="btn wide" id="btnGps">获取当前定位</button>
    <div class="ph" id="outShot" style="margin-top:12px;aspect-ratio:16/10"><span>户外实拍照（定位不可用时必填）</span><span style="font-size:20px">🏞️</span></div>
    <button class="btn line wide" id="btnOutShoot">拍户外照</button>
    <button class="btn line wide" id="btnOutSubmit" disabled>提交出门打卡</button>`);

  let pos = null, shot = null;
  const refresh = ()=>{
    const b = document.getElementById("btnOutSubmit");
    b.disabled = !((pos && (!anchor || dist(pos) >= S.settings.radius)) || shot);
  };
  document.getElementById("btnGps").onclick = ()=>{
    const box = document.getElementById("gpsBox");
    box.innerHTML = "定位中…";
    if(!navigator.geolocation){ box.innerHTML = "这台设备不支持定位，请用户外照"; return; }
    navigator.geolocation.getCurrentPosition(p=>{
      const c = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy};
      pos = c;
      const dd = anchor ? dist(c) : null;
      const line = dd===null ? "尚未设置基准点，本次按通过处理" :
        (dd >= S.settings.radius ? `<b style="color:var(--acc)">${Math.round(dd)} 米</b>已离开基准点` :
         `<b style="color:var(--warn)">${Math.round(dd)} 米</b>还在附近，再走远一点`);
      box.innerHTML = line + `<br>精度 ±${Math.round(c.acc)} 米`;
      refresh();
    }, err=>{
      box.innerHTML = "定位失败：" + (err.message||"权限被拒绝") + "<br>请用户外照提交";
      refresh();
    }, {enableHighAccuracy:true, timeout:12000, maximumAge:0});
  };
  document.getElementById("btnOutShoot").onclick = ()=>{
    shoot(p=>{ shot=p; document.getElementById("outShot").innerHTML=`<img src="${p}">`; refresh(); });
  };
  document.getElementById("btnOutSubmit").onclick = ()=>{
    const d = day(today());
    const c = pos || null;
    const dd = (c && anchor) ? dist(c) : 0;
    if(c && !anchor){ S.settings.anchor = {lat:c.lat, lng:c.lng}; toast("已把当前位置设为基础点"); }
    const late = new Date() > atTime(S.settings.outBy);
    d.out = {t:Date.now(), method: c && (!anchor || dd>=S.settings.radius) ? "gps" : "photo",
             lat:c?c.lat:null, lng:c?c.lng:null, dist:dd, photo:shot, late};
    save(); closeSheet(); renderAll();
    toast(late ? "出门打卡完成，已经过了建议时间" : "出门打卡完成，今天出去了");
  };
}

function openMood(dateKey){

  const tags = ["疲惫","焦虑","平静","有精神","拖延","专注","孤独","想放弃","还不错"];
  let score = rec ? (rec.score||3) : 3;
  const picked = new Set(rec && rec.tags ? rec.tags : []);
  const isEdit = !!rec;
  const dayLabel = k===today() ? "今天" : k.slice(5).replace("-","月")+"日";
  openSheet(`<h3>${isEdit?"编辑心情日记":"心情日记"}</h3>

    <div class="moodrow" id="mOpt">${MOOD_IMG.map((m,i)=>`<button data-s="${i+1}" class="mbtn ${(i+1)===score?"sel":""}"><img src="${m}" alt=""><span>${MOOD_TXT[i]}</span></button>`).join("")}</div>
    <div class="opt" id="gOpt" style="margin-top:12px">${tags.map(t=>`<button data-t="${t}" class="${picked.has(t)?"sel":""}">${t}</button>`).join("")}</div>
    <textarea id="mText" rows="4" placeholder="今天最想记下的一件事…" style="margin-top:14px">${isEdit?esc(rec.text||""):""}</textarea>

  document.querySelectorAll("#mOpt button").forEach(b=>b.onclick=()=>{
    score=+b.dataset.s; document.querySelectorAll("#mOpt button").forEach(x=>x.classList.toggle("sel",x===b));
  });
  document.querySelectorAll("#gOpt button").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t; if(picked.has(t)){picked.delete(t);b.classList.remove("sel");} else {picked.add(t);b.classList.add("sel");}

    const txt = document.getElementById("mText").value.trim();

    toast(isEdit ? "日记已修改" : "日记已保存");

function monthView(){
  const {y,m} = calYM;
  const days = new Date(y, m+1, 0).getDate();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;   // 周一为首列
  const setOf = "一 二 三 四 五 六 日".split(" ");
  const now = new Date();
  const isCur = (y === now.getFullYear() && m === now.getMonth());
  let cells = "";
  for(let i=0;i<lead;i++) cells += '<div class="calcell blank"></div>';
  for(let d=1; d<=days; d++){
    const k = `${y}-${pad(m+1)}-${pad(d)}`;
    const rec = S.days[k];
    const hasMood = !!(rec && rec.mood);
    const full = allDone(rec);
    const isToday = k === today();
    const future = k > today();
    let inner;
    if (hasMood) {
      inner = moodImg(rec.mood.score, 40, full ? "" : "dim");
    } else {
      inner = '<span class="empty"></span>';
    }
    cells += `<div class="calcell${isToday?" today":""}${future?" future":""}"`
           + ` data-day="${k}"><div class="dn">${d}</div><div class="de">${inner}</div></div>`;
  }
  const tail = (7 - (lead+days) % 7) % 7;
  for(let i=0;i<tail;i++) cells += '<div class="calcell blank"></div>';

  return `<div class="calnav">
      <button id="calPrev" aria-label="上个月">‹</button>
      <div class="m">${y} 年 ${m+1} 月</div>
      <button id="calNext" aria-label="下个月" ${isCur ? "disabled" : ""}>›</button>
    </div>
    <div class="calwk">${setOf.map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="calgrid">${cells}</div>`;
}
function bar(name,f){
  const arr=[]; for(let i=0;i<30;i++) arr.push(addDays(new Date(),-i));
  const n = arr.filter(d=>{ const dd=S.days[key(d)]; return dd && dd[f]; }).length;
  const p = Math.round(n/30*100);
  return `<div class="barrow"><div class="n">${name}</div><div class="b"><i style="width:${p}%"></i></div><div class="p">${p}%</div></div>`;
}

function syncNativeAlarms(){
  if(!window.NativeUI) return;
  try{
    if(S.settings.notify) NativeUI.syncAlarms(S.settings.wake, S.settings.sleep);
    else NativeUI.cancelAlarms();
  }catch(e){}

function compareVer(a, b){
  const pa = String(a).split(".").map(n=>parseInt(n,10)||0);
  const pb = String(b).split(".").map(n=>parseInt(n,10)||0);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const x = pa[i]||0, y = pb[i]||0;
    if(x!==y) return x-y;
  }
  return 0;
}
/* ===== 版本更新 ===== */
async function checkUpdate(){
  if(!UPDATE_JSON_URL){ toast("尚未配置更新地址（GitHub 托管后填入代码里的 UPDATE_JSON_URL）"); return; }
  try{
    const r = await fetch(UPDATE_JSON_URL + (UPDATE_JSON_URL.indexOf("?")>=0?"&":"?") + "t=" + Date.now(), {cache:"no-store"});
    const j = await r.json();
    if(!j || !j.version){ toast("更新信息格式不正确"); return; }
    if(compareVer(j.version, APP_VERSION) > 0){
      const notes = j.notes ? ("\n" + j.notes) : "";
      if(confirm("发现新版本 v" + j.version + notes + "\n\n是否立即下载并更新？")){
        toast("开始下载更新包…");
        if(window.NativeUI){ try{ NativeUI.downloadAndInstall(j.apkUrl, j.version); return; }catch(e){} }
        window.open(j.apkUrl, "_blank");
      }
    } else {
      toast("当前已是最新版本 v" + APP_VERSION);
    }
  }catch(e){ toast("检查更新失败：" + (e&&e.message?e.message:e)); }
}

/* ===== 渲染：设置 ===== */
function renderSet(){
  const s = S.settings;
  // 用户若在系统设置里关掉了通知，开关同步置为关闭
  if(window.NativeUI && s.notify){ try{ if(!NativeUI.areNotificationsEnabled()){ s.notify=false; save(); } }catch(e){} }
  const anchorTxt = s.anchor ? `${s.anchor.lat.toFixed(5)}, ${s.anchor.lng.toFixed(5)}` : "未设置";
  const themeSeg = [["auto","跟随系统"],["light","浅色"],["dark","深色"]]
    .map(x=>`<button data-theme="${x[0]}" class="${s.theme===x[0]?"on":""}">${x[1]}</button>`).join("");

  document.getElementById("main").innerHTML = `
  <div class="panel" style="margin-top:12px">
    <div class="panel-h">作息时间</div>
    <div class="row">
      <div><div class="lb">起床闹钟</div><div class="ds">到点弹出全屏起床挑战</div></div>
      <input type="time" id="setWake" value="${s.wake}">
    </div>
    <div class="row">
      <div><div class="lb">就寝时间</div><div class="ds">到点提醒你收尾、补日记</div></div>
      <input type="time" id="setSleep" value="${s.sleep}">
    </div>
    <div class="row">
      <div><div class="lb">出门截止</div><div class="ds">晚于这个时间打卡会标记偏晚</div></div>
      <input type="time" id="setOutBy" value="${s.outBy}">
    </div>
    <div class="row">
      <div><div class="lb">宽限时间</div><div class="ds">起床后多少分钟内算准时</div></div>
      <input type="number" id="setGrace" value="${s.grace}" min="0" max="180" step="5">
    </div>
  </div>

  <div class="panel">
    <div class="panel-h">外观</div>
    <div class="seg" id="themeSeg">${themeSeg}</div>
  </div>

  <div class="panel">
    <div class="panel-h">出门判定</div>
    <div class="row">
      <div><div class="lb">出门半径</div><div class="ds">距基准点多少米外算「出门」</div></div>
      <input type="number" id="setRadius" value="${s.radius}" min="50" max="20000" step="50">
    </div>
    <div class="row">
      <div><div class="lb">基准点（家）</div><div class="ds">${anchorTxt}</div></div>
      <button class="btn ghost" id="setAnchor">用当前位置</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-h">提醒</div>
    <div class="row">
      <div><div class="lb">系统通知</div><div class="ds">允许后闹钟可推送提醒</div></div>
      <div class="switch ${s.notify?"on":""}" id="setNotify"><i></i></div>
    </div>
    <div class="row">
      <div><div class="lb">测试闹钟</div><div class="ds">立刻预览起床挑战界面</div></div>
      <button class="btn ghost" id="testAlarm">预览</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-h">数据</div>
    <div class="row">
      <div><div class="lb">导出备份</div><div class="ds">JSON 文件，含全部记录与照片</div></div>
      <button class="btn ghost" id="btnExport">导出</button>
    </div>
    <div class="row">
      <div><div class="lb">导入备份</div><div class="ds">用备份文件覆盖当前数据</div></div>
      <button class="btn ghost" id="btnImport">导入</button>
    </div>
    <div class="row" style="border-bottom:0">
      <div><div class="lb">清空所有记录</div><div class="ds">不可恢复，照片一并删除</div></div>
      <button class="btn danger" id="setReset">清空</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-h">关于</div>
    <div class="row">
      <div><div class="lb">当前版本</div><div class="ds">自律 OS v${APP_VERSION}</div></div>
      <button class="btn ghost" id="btnCheckUpdate">检查更新</button>
    </div>
    <div class="row" style="border-bottom:0">
      <div><div class="lb">更新方式</div><div class="ds">发现新版本后会下载安装包并覆盖安装（需保持同一签名）</div></div>
    </div>
  </div>

  <div class="help">
  · 数据存于本机浏览器，换设备或清缓存会丢，建议定期「导出备份」<br>
  · 定位需要授权浏览器「允许获取位置」<br>
  · 照片仅保留最近 ${PHOTO_KEEP_DAYS} 天，节省存储
  </div>`;

  const bindTime = (id, field)=>{
    const el = document.getElementById(id);
    el.onchange = ()=>{ if(el.value){ S.settings[field] = el.value; save(); renderAll(); if(field==="wake"||field==="sleep") syncNativeAlarms(); } };
  };
  bindTime("setWake","wake"); bindTime("setSleep","sleep"); bindTime("setOutBy","outBy");
  document.getElementById("setGrace").onchange = e=>{ S.settings.grace=Math.max(0,Math.min(180,+e.target.value||0)); save(); renderAll(); };
  document.getElementById("setRadius").onchange = e=>{ S.settings.radius=Math.max(50,+e.target.value||300); save(); renderAll(); };

  document.querySelectorAll("#themeSeg button").forEach(b=>b.onclick=()=>{
    S.settings.theme = b.dataset.theme; save(); applyTheme(); renderAll();
  });
  document.getElementById("setNotify").onclick = ()=>{
    const el = document.getElementById("setNotify");
    if(!window.NativeUI){ toast("当前环境不支持系统通知"); return; }
    if(S.settings.notify){
      S.settings.notify = false; el.classList.remove("on"); save();
      try{ NativeUI.cancelAlarms(); }catch(e){}
      toast("已关闭提醒");
      return;
    }
    try{ NativeUI.enableNotifications(); }catch(e){}
    toast("请在系统设置里允许「自律 OS」通知，然后返回");
    let tries = 0;
    const t = setInterval(()=>{
      tries++;
      let on = false;
      try{ on = NativeUI.areNotificationsEnabled(); }catch(e){}
      if(on){
        S.settings.notify = true;
        document.getElementById("setNotify").classList.add("on");
        save(); syncNativeAlarms();
        toast("通知已开启，闹钟会在后台提醒你");
        clearInterval(t);
      } else if(tries > 25){
        clearInterval(t);
        toast("未检测到通知权限，闹钟将只在 App 打开时提醒");
      }
    }, 1000);
  };
  document.getElementById("btnCheckUpdate").onclick = checkUpdate;
  document.getElementById("setAnchor").onclick = ()=>{
    if(!navigator.geolocation) return toast("不支持定位");
    navigator.geolocation.getCurrentPosition(p=>{
      S.settings.anchor = {lat:p.coords.latitude, lng:p.coords.longitude};
      save(); renderAll(); toast("基准点已设为当前位置");
    }, ()=>toast("定位失败，检查权限"));
  };
  document.getElementById("testAlarm").onclick = ()=> fireAlarm(true);
  document.getElementById("btnExport").onclick = exportData;
  document.getElementById("btnImport").onclick = ()=> jsonInput.click();
  document.getElementById("setReset").onclick = ()=>{
    if(confirm("确定清空全部记录？无法恢复。")){
      localStorage.removeItem(LS); S=load(); applyTheme(); renderAll(); closeSheet(); toast("已清空");
    }
  };
  document.getElementById("themeBtn").onclick = toggleTheme;
}

/* ===== 导出 / 导入 ===== */
const jsonInput = document.getElementById("jsonInput");
function exportData(){
  const payload = {app:"selfdrive", version:1, exportedAt:new Date().toISOString(), settings:S.settings, days:S.days};
  const json = JSON.stringify(payload);
  const name = "自律OS备份-" + today() + ".json";
  let done = false;
  try{
    const blob = new Blob([json], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    done = true;
  }catch(e){}
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(()=>{
      toast(done ? "已下载备份，同时复制到剪贴板" : "已复制到剪贴板，粘贴保存即可");
    }).catch(()=>{ if(!done) fallbackCopy(json); else toast("已下载备份文件"); });
  }else if(!done){ fallbackCopy(json); }
  else toast("已下载备份文件");
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("已复制到剪贴板，粘贴保存即可"); }
  catch(e){ toast("导出失败，请换浏览器重试"); }
  ta.remove();
}
jsonInput.addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  jsonInput.value = "";
  if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const o = JSON.parse(String(fr.result));
      if(!o || typeof o.days !== "object") throw new Error("bad");
      const cnt = Object.keys(o.days).length;
      if(!confirm("导入 " + cnt + " 天的记录，将覆盖当前数据。继续？")) return;
      S = Object.assign(defState(), {days:o.days},
            {settings:Object.assign(defState().settings, o.settings||{})});
      S.tab = "today";
      save(); applyTheme(); renderAll(); toast("导入完成");
    }catch(err){ toast("文件无法识别，请选择导出时的 JSON"); }
  };
  fr.readAsText(f);
});

/* ===== 总渲染 ===== */
function renderAll(){
  const now = new Date();
  const L = level();
  document.getElementById("hdDate").textContent =
    now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日 · "+WEEK[now.getDay()];
  const h = now.getHours();
  const greet = h<5?"夜深了":h<9?"早上好":h<12?"上午好":h<14?"中午好":h<18?"下午好":h<23?"晚上好":"夜深了";
  document.getElementById("hdHello").textContent = greet;
  document.getElementById("hdLv").textContent = L.lv;
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on", b.dataset.tab===S.tab));
  if(S.tab==="today") renderToday();
  else if(S.tab==="stats") renderStats();
  else renderSet();
}
document.querySelectorAll(".tabbar button").forEach(b=>{
  b.onclick = ()=>{ S.tab=b.dataset.tab; closeSheet(); renderAll(); window.scrollTo(0,0); };
});

/* ===== 闹钟 ===== */
const alarmEl = document.getElementById("alarm");
let firedFor = null, snoozeUntil = 0, snoozeCount = 0;

function fireAlarm(isTest){
  const d = new Date();
  document.getElementById("alClock").textContent = pad(d.getHours())+":"+pad(d.getMinutes());
  document.getElementById("alMsg").textContent = isTest
    ? "这是预览。真实闹钟会在设定时间弹出这个界面。"
    : "该起床了。拍一张洗漱完的照片，今天才算开始。";
  alarmEl.classList.add("show");
  beep(4);
  if(navigator.vibrate) navigator.vibrate([400,200,400,200,600]);
  if(!isTest && S.settings.notify && window.NativeUI){
    try{ NativeUI.notify("自律 OS · 起床挑战", "拍一张洗漱完的照片，今天才算开始。"); }catch(e){}
  }
}
function dismissAlarm(){ alarmEl.classList.remove("show"); }
document.getElementById("alGo").onclick = ()=>{ dismissAlarm(); openWake(); };
document.getElementById("alSnooze").onclick = ()=>{
  if(snoozeCount>=2){ toast("最多延后两次，去打卡吧"); return; }
  snoozeCount++; snoozeUntil = Date.now() + 5*60*1000;
  dismissAlarm(); toast("5 分钟后再叫你");
};

function checkAlarm(){
  if(firedFor === today()) return;
  if(Date.now() < snoozeUntil) return;
  const target = atTime(S.settings.wake);
  if(target > new Date()) return;
  if(new Date() - target > 6*3600*1000) return;
  if(S.days[today()] && S.days[today()].wake) return;
  firedFor = today();
  fireAlarm(false);
}
function checkNap(){
  const k = today();
  if(!S.flags) S.flags = {};
  if(S.flags["nap_"+k]) return;
  const sl = atTime(S.settings.sleep);
  if(new Date() < sl) return;
  const d = S.days[k] || {};
  if(d.mood) return;
  S.flags["nap_"+k] = true; save();
  if(S.settings.notify && window.NativeUI){ try{ NativeUI.notify("自律 OS · 该写日记了", "到就寝时间了，今天的心情日记还没写"); }catch(e){} }
  toast("到就寝时间了，今天的心情日记还没写");
}
setInterval(()=>{ checkAlarm(); checkNap(); }, 15000);
setTimeout(()=>{ checkAlarm(); }, 800);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkAlarm(); });

/* ===== 启动 ===== */
S = load();
save();                       /* 补齐旧版本缺失的默认字段 */
document.getElementById("themeBtn").onclick = toggleTheme;
applyTheme();
renderAll();
syncNativeAlarms();           /* 把闹钟/提醒同步到原生，保证后台也能响 */
</script>
